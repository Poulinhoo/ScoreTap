name: ScoreTap
options:
  bundleIdPrefix: com.poulinhoo
targets:
  ScoreTap:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ScoreTap Watch App
    info:
      path: ScoreTap Watch App/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
